server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Increase body size limit for BOM CSV uploads
    client_max_body_size 20m;

    # Re-resolve backend DNS on every request (Railway assigns new IPs on each deploy)
    resolver ${DNS_RESOLVER} valid=10s ipv6=off;
    set $backend_upstream "http://${BACKEND_HOST}:${BACKEND_PORT}";

    # Proxy /api/* to backend (strips /api prefix, replicating Vite proxy rewrite)
    location /api/ {
        rewrite ^/api/(.*) /$1 break;
        proxy_pass $backend_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;

        # SSE support for AI copilot streaming
        proxy_buffering off;
        proxy_cache off;
        proxy_set_header Connection '';
        proxy_http_version 1.1;
        chunked_transfer_encoding off;
    }

    # React Router: return index.html for all non-file routes
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Cache static assets aggressively (Vite adds content hashes to filenames)
    location ~* \.(js|css|woff2?|ttf|eot|ico|svg|png|jpg|gif)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}
